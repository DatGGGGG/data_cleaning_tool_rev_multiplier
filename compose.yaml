services:
  sensortower-cleaning-workbench:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /cleaning/sensortower
    container_name: sensortower-cleaning-workbench
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TZ: Asia/Bangkok
    ports:
      - "${WORKBENCH_PORT:-3015}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sensortower_cleaning_storage:/app/storage
    networks:
      market_data_gateway:
        aliases:
          - sensortower-cleaning-workbench
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/cleaning/sensortower/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  sensortower_cleaning_storage:
    name: sensortower_cleaning_storage

networks:
  market_data_gateway:
    external: true
    name: market-data-gateway
